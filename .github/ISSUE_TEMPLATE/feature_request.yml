name: Feature request
description: Suggest an idea or enhancement
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Include UX ideas where relevant, in line with the VS Code UX guidelines.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to implement this?
      options:
        - "No"
        - "Yes, a small change"
        - "Yes, a major contribution (new service, resource type, or substantial feature)"
    validations:
      required: true
  - type: checkboxes
    id: ownership
    attributes:
      label: Ownership
      description: Major contributions require long-term ownership. See CONTRIBUTING.md.
      options:
        - label: If this is a major contribution, I agree to own the code long-term.
