name: Task
description: Track a unit of work (refactoring, chores, maintenance, docs)
type: Task
body:
  - type: textarea
    id: description
    attributes:
      label: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know this is done?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related issues, PRs, or docs.
