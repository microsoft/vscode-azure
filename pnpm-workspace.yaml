packages:
  - packages/utils
  - packages/azutils
  - extensions/vscode-azure
allowBuilds:
  "@vscode/vsce-sign": true
  esbuild: true
  keytar: true
minimumReleaseAgeExclude:
  - "@typescript/native-preview*"
  - "@microsoft/vscode-azext*"
  - "@azure/arm-appservice@19.0.0" # TODO: Temporary
publicHoistPattern:
  - "*eslint*"
  - "typescript"
  - "mocha"
  - "@types/mocha"
  - "chai"
  - "@types/chai"
catalog:
  "@microsoft/vscode-processutils": ^0.2.2
  "@vscode/extension-telemetry": ^1.5.1
  inversify: ^8.1.0
