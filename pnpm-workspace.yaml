packages:
  - packages/utils
  - packages/azutils
  - extensions/vscode-azure
allowBuilds:
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true
minimumReleaseAgeExclude:
  - '@typescript/native-preview*'
  - '@microsoft/vscode-azext*'
publicHoistPattern:
  - '*eslint*'
  - 'typescript'
  - 'mocha'
  - '@types/mocha'
  - 'chai'
  - '@types/chai'
